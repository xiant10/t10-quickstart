# Builds from sibling checkouts instead of the pinned images, to try local
# changes: docker compose -f compose.yml -f compose.dev.yml up -d --build --wait
# The builds get their own image names, so they never stand in for a pinned one.
services:
  seed:
    image: !reset null
    build: ../auth-server
  auth-server:
    image: !reset null
    build: ../auth-server
  t10-collab:
    image: !reset null
    build: ../t10-collab
  agent-pi:
    image: !reset null
    build: ../agent-pi
  workbench:
    image: !reset null
    build: ../workbench
  # The one endpoint for these images' docs, at http://127.0.0.1:28220/mcp. Only
  # here: it's built from the t10 workspace this checkout sits in, which isn't public.
  t10-docs:
    build:
      context: ..
      dockerfile: docs-server/Dockerfile
    environment:
      DOCS_SOURCES: auth-server=http://auth-server:8081,t10-collab=http://t10-collab:8082,agent-pi=http://agent-pi:9800,workbench=http://workbench:8083
    ports:
      - "127.0.0.1:28220:18220"
